[package]
name = "gitgoblin"
version = "0.1.0"
description = "A Git workbench with shared T3 Code conversations"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"

tempfile = "3"
keyring = { version = "3.6.3", features = ["windows-native", "apple-native", "sync-secret-service"] }

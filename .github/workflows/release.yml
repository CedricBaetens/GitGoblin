name: Release Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (for example 0.2.0)'
        required: true
        type: string
      publish:
        description: 'Publish immediately (otherwise create a draft release)'
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-windows
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Set release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/release-version.mjs
      - name: Reject an existing tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        shell: pwsh
        run: |
          $tags = gh api "repos/$env:GITHUB_REPOSITORY/git/matching-refs/tags/v$env:RELEASE_VERSION" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not check existing release tags.' }
          if ($tags | Where-Object { $_.ref -eq "refs/tags/v$env:RELEASE_VERSION" }) {
            throw 'This version already has a tag. Choose a new version, or remove the failed draft and its tag before retrying.'
          }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm native:test
      - name: Build installer and create release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tagName: v${{ inputs.version }}
          releaseName: GitGoblin v${{ inputs.version }}
          releaseCommitish: ${{ github.sha }}
          releaseDraft: ${{ !inputs.publish }}
          generateReleaseNotes: true
          uploadUpdaterJson: false
          uploadWorkflowArtifacts: true
          args: --bundles nsis
